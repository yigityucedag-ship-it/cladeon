[workspace]
resolver = "2"
members = [
    "crates/cl-contracts",
    "crates/cl-core",
    "crates/cl-facts",
    "crates/cl-inventory",
    "crates/cl-formats",
    "crates/cl-rules",
    "crates/cl-markers",
    "crates/cl-report",
    "crates/cl-bundle",
    "crates/cl-case",
    "crates/cl-screen",
    "crates/cl-verify",
    "crates/cl-fixtures",
]

[workspace.package]
version = "0.1.0"
description = "Checks whether an AI vendor's artifacts are consistent with how they say the system was built."
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE.md"
authors = ["Yiğit Murat Yücedağ"]

# Dependency policy (enforced by tests/dependency_policy.rs):
#
#   No third-party crate may parse bytes that originate from a vendor-supplied
#   artifact or from a .clade bundle. JSON, YAML, TOML, SafeTensors, GGUF, ONNX,
#   ZIP and PDF parsing are all implemented in-repo with explicit bounds.
#
#   The only external dependencies are:
#     sha2           - audited SHA-256 (we do not hand-roll cryptographic hashes)
#     ed25519-dalek  - audited signatures (we do not hand-roll signature schemes)
#     getrandom      - OS entropy for nonces and key material
#     clap           - command-line argument parsing (never sees artifact bytes)
[workspace.dependencies]
cl-core = { path = "crates/cl-core" }
cl-facts = { path = "crates/cl-facts" }
cl-inventory = { path = "crates/cl-inventory" }
cl-formats = { path = "crates/cl-formats" }
cl-rules = { path = "crates/cl-rules" }
cl-markers = { path = "crates/cl-markers" }
cl-report = { path = "crates/cl-report" }
cl-bundle = { path = "crates/cl-bundle" }
cl-case = { path = "crates/cl-case" }
cl-fixtures = { path = "crates/cl-fixtures" }

sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
getrandom = "0.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
